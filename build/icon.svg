<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262640"/>
      <stop offset="1" stop-color="#0e0e16"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Полумесяц -->
  <circle cx="392" cy="110" r="28" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="380" cy="102" r="28" fill="#262640"/>

  <!-- Свечение под графиком -->
  <rect x="80" y="330" width="352" height="110" fill="url(#lineGlow)"/>

  <!-- Площадь под графиком -->
  <path d="M96 396 L168 336 L232 358 L296 276 L356 220 L416 236 L416 440 L96 440 Z" fill="url(#area)"/>

  <!-- Линия графика -->
  <path d="M96 396 L168 336 L232 358 L296 276 L356 220 L416 236" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)"/>

  <!-- Точки на графике -->
  <circle cx="168" cy="336" r="10" fill="#34d399"/>
  <circle cx="232" cy="358" r="10" fill="#34d399"/>
  <circle cx="296" cy="276" r="10" fill="#34d399"/>
  <circle cx="356" cy="220" r="10" fill="#34d399"/>

  <!-- Стрелка роста -->
  <path d="M332 178 L407 178 L407 253" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M407 158 L441 198 L373 198 Z" fill="#34d399"/>
</svg>